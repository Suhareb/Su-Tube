name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release-key.jks

      - name: Assemble debug and release
        env:
          SUTUBE_KEYSTORE: ${{ github.workspace }}/release-key.jks
          SUTUBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUTUBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUTUBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Rename Release APK
        run: cp app/build/outputs/apk/release/app-release.apk Su-Tube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Su-Tube-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            Su-Tube.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Su-Tube.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
